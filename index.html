            color: #e67e22;
            font-size: 14px;

            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;

        th, td {

    function renderTable(list) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">找不到符合的資料</td></tr>`;
            return;
        }
        list.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td><strong>${row[0]}</strong></td><td><span class="badge">${row[1]}</span></td><td><span class="floor-badge">${row[2]}</span></td><td>${row[3]}</td>`;
            tbody.appendChild(tr);
        });
    }

    function filterTable() {
        const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
        if (!keyword) {
            renderTable(data);
            return;
        }
        const filtered = data.filter(row => 
            row[0].toLowerCase().includes(keyword) || 
            row[1].toLowerCase().includes(keyword) || 
            row[2].toLowerCase().includes(keyword) ||
            row[3].toLowerCase().includes(keyword)
        );
        renderTable(filtered);
    }

    function triggerCamera() {
        document.getElementById("realFileinput").click();
    }

    function processImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusMsg = document.getElementById("statusMsg");
        statusMsg.style.display = "block";
        statusMsg.innerText = "🔍 正在進行 AI 光學字體辨識，請稍候...";

        Tesseract.recognize(
            file,
            'chi_tra+eng',
            { logger: m => console.log(m) }
        ).then(({ data: { text } }) => {
            statusMsg.style.display = "none";
            const cleanText = text.replace(/\s+/g, '');
            
            let matched = [];
            data.forEach(row => {
                if (cleanText.includes(row[0])) {
                    if (!matched.some(m => m[0] === row[0])) {
                        matched.push(row);
                    }
                }
            });

            if (matched.length > 0) {
                renderTable(matched);
                document.getElementById("searchInput").value = matched[0][0];
                alert(`🎯 成功辨識並找到：${matched[0][0]} (${matched[0][2]} / ${matched[0][1]})`);
            } else {
                alert(`📷 圖片文字辨識結果：\n"${text.trim()}\n\n未直接找到完全相符的同事姓名，已將文字列出，您可手動微調搜尋。`);
                document.getElementById("searchInput").value = text.trim().substring(0, 4);
                filterTable();
            }
        }).catch(err => {
            statusMsg.style.display = "none";
            alert("❌ 辨識發生錯誤，請重新拍照或直接手動輸入姓名搜尋。");
        });
    }

    renderTable(data);
